version: '3.3'

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  monitor_net:
    driver: bridge

volumes:
  db_data:
  wp_data:
  prom_data:
  grafana_data:

services:
  nginx:
    image: nginx:alpine
    container_name: wp_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend_net
      - monitor_net
    depends_on:
      - wordpress

  wordpress:
    image: wordpress:latest
    container_name: wp_web
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - wp_data:/var/www/html
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: wp_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wp_pma
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PMA_ABSOLUTE_URI: https://192.168.182.129/pma/
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - db

  prometheus:
    image: prom/prometheus:latest
    container_name: wp_prometheus
    user: "65534"
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - monitor_net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: wp_grafana
    user: "472"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitor_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: wp_cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitor_net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: wp_node_exporter
    ports:
      - "9101:9100"
    networks:
      - monitor_net

  loki:
    image: grafana/loki:2.9.2
    container_name: wp_loki
    ports:
      - "3101:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - monitor_net
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.2
    container_name: wp_promtail
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    networks:
      - monitor_net
    command: -config.file=/etc/promtail/config.yml
